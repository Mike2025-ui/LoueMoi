services:
  db:
    image: postgres:16-alpine
    container_name: louemoi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-louemoi_db}
      POSTGRES_USER: ${POSTGRES_USER:-louemoi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-louemoi_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-louemoi_user} -d ${POSTGRES_DB:-louemoi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - louemoi_network

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: louemoi_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/properties/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - louemoi_network

  nginx:
    image: nginx:alpine
    container_name: louemoi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/web:/var/html/web:ro
      - static_volume:/var/html/static:ro
      - media_volume:/var/html/media:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - louemoi_network

  certbot:
    image: certbot/certbot:latest
    container_name: louemoi_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - louemoi_network

volumes:
  postgres_data:
    name: louemoi_postgres_data
  static_volume:
    name: louemoi_static_volume
  media_volume:
    name: louemoi_media_volume
  certbot_conf:
    name: louemoi_certbot_conf
  certbot_www:
    name: louemoi_certbot_www

networks:
  louemoi_network:
    name: louemoi_network
    driver: bridge

